name: Supabase Heartbeat

on:
  schedule:
    # Sunday + Wednesday at 00:00 UTC — Supabase free tier pauses projects
    # after 7 consecutive days without database activity, and twice-weekly
    # keeps a missed run from exceeding that window.
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          curl -sS --fail-with-body \
            "$SUPABASE_URL/rest/v1/contact_submissions?select=id&limit=1" \
            -H "apikey: $SUPABASE_API_KEY" \
            -H "Authorization: Bearer $SUPABASE_API_KEY"
          echo "Heartbeat OK — database received a query."
